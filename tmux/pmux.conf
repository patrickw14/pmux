# ============================================
# pmux — opinionated tmux configuration
# https://github.com/patrickwilson/pmux
# ============================================

# ============================================
# Prefix Key
# ============================================
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ============================================
# Mouse Support
# ============================================
set -g mouse on

# ============================================
# Intuitive Split Bindings
# ============================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ============================================
# 1-Based Indexing
# ============================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ============================================
# Faster Key Response
# ============================================
set -sg escape-time 0

# ============================================
# Window Size (resize to latest active client)
# ============================================
set -g window-size latest
setw -g aggressive-resize on

# ============================================
# True Color Support
# ============================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ============================================
# Quick Config Reload
# ============================================
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ============================================
# Preserve Working Directory
# ============================================
bind c new-window -c "#{pane_current_path}"

# ============================================
# Increased History
# ============================================
set -g history-limit 50000

# ============================================
# Vi Copy Mode
# ============================================
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# ============================================
# Status Bar (layout — colors come from theme)
# ============================================
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# ============================================
# Pane Borders
# ============================================
set -g pane-border-status top
set -g pane-border-indicators colour

# ============================================
# Popup Styling (tmux 3.3+)
# ============================================
set -g popup-border-lines rounded

# ============================================
# Theme
# ============================================
# Load active theme (falls back to tokyo-night)
if-shell '[ -f ~/.config/pmux/theme ]' \
  'run-shell "tmux source-file ~/.tmux/themes/$(cat ~/.config/pmux/theme).conf"' \
  'source-file ~/.tmux/themes/tokyo-night.conf'

# Clock (prefix + h)
bind h clock-mode

# Theme switcher menu (prefix + t)
bind t run-shell '~/.tmux/scripts/pmux-theme.sh'

# ============================================
# Alt-Arrow Pane Navigation
# ============================================
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ============================================
# Plugin Manager (TPM)
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

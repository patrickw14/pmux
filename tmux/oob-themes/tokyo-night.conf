# pmux theme: Tokyo Night
# Classic dark theme with cool blue accents

# Status bar
set -g status-style 'bg=#24283b fg=#c0caf5'
set -g status-left '#[bg=#7aa2f7,fg=#15161e,bold]  #S #[bg=#24283b,fg=#7aa2f7] '
set -g status-right '#[fg=#414868,bg=#24283b]#{?#{==:#(~/.tmux/scripts/pmux-claude-usage.sh),},,#[bg=#414868#,fg=#7dcfff]  #(~/.tmux/scripts/pmux-claude-usage.sh) #[fg=#24283b]│}#[bg=#414868,fg=#565f89]  %Y-%m-%d #[fg=#7aa2f7,bg=#414868]#[bg=#7aa2f7,fg=#15161e,bold]  %-l:%M#{?#{==:%p,AM},am,pm} '

# Window status
setw -g window-status-format '#[fg=#565f89,bg=#24283b]  #I:#W '
setw -g window-status-current-format '#[fg=#24283b,bg=#7aa2f7]#[fg=#15161e,bg=#7aa2f7,bold]  #I:#W #[fg=#7aa2f7,bg=#24283b]'
setw -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#89b4fa'

# Pane border labels
setw -g pane-border-format '#{?pane_active,#[bg=#7aa2f7#,fg=#15161e#,bold] #{pane_index}: #{pane_current_command} ,#[bg=#414868#,fg=#565f89] #{pane_index}: #{pane_current_command} }'

# Message & command prompt
set -g message-style 'bg=#7aa2f7 fg=#15161e bold'
set -g message-command-style 'bg=#414868 fg=#c0caf5'

# Copy / choice mode
setw -g mode-style 'bg=#7aa2f7 fg=#15161e bold'
set -g copy-mode-match-style 'bg=#414868,fg=#c0caf5'
set -g copy-mode-current-match-style 'bg=#ff9e64,fg=#15161e,bold'

# Popup & menus
set -g popup-border-style 'fg=#7aa2f7'
set -g popup-style 'bg=#1a1b26,fg=#c0caf5'
set -g menu-style 'bg=#24283b,fg=#c0caf5'
set -g menu-selected-style 'bg=#7aa2f7,fg=#1a1b26,bold'
set -g menu-border-style 'fg=#414868'

# Clock
setw -g clock-mode-colour '#7aa2f7'

# Inactive pane dimming
set -g window-style 'bg=#13131f'
set -g window-active-style 'bg=#1a1b26'

# pmux theme: Daylight
# Clean, warm light theme

# Status bar
set -g status-style 'bg=#dde1e8 fg=#2e3440'
set -g status-left '#[bg=#1a6be0,fg=#ffffff,bold]  #S #[bg=#dde1e8,fg=#1a6be0] '
set -g status-right '#[fg=#b0b8c4,bg=#dde1e8]#{?#{==:#(~/.tmux/scripts/pmux-claude-usage.sh),},,#[bg=#b0b8c4#,fg=#12448f]  #(~/.tmux/scripts/pmux-claude-usage.sh) #[fg=#dde1e8]│}#[bg=#b0b8c4,fg=#2e3440]  %Y-%m-%d #[fg=#1a6be0,bg=#b0b8c4]#[bg=#1a6be0,fg=#ffffff,bold]  %-l:%M#{?#{==:%p,AM},am,pm} '

# Window status
setw -g window-status-format '#[fg=#7c8596,bg=#dde1e8]  #I:#W '
setw -g window-status-current-format '#[fg=#dde1e8,bg=#1a6be0]#[fg=#ffffff,bg=#1a6be0,bold]  #I:#W #[fg=#1a6be0,bg=#dde1e8]'
setw -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#b0b8c4'
set -g pane-active-border-style 'fg=#1a6be0'

# Pane border labels
setw -g pane-border-format '#{?pane_active,#[bg=#1a6be0#,fg=#ffffff#,bold] #{pane_index}: #{pane_current_command} ,#[bg=#b0b8c4#,fg=#ffffff] #{pane_index}: #{pane_current_command} }'

# Message & command prompt
set -g message-style 'bg=#1a6be0 fg=#ffffff bold'
set -g message-command-style 'bg=#b0b8c4 fg=#2e3440'

# Copy / choice mode
setw -g mode-style 'bg=#1a6be0 fg=#ffffff bold'
set -g copy-mode-match-style 'bg=#b0b8c4,fg=#2e3440'
set -g copy-mode-current-match-style 'bg=#d65d0e,fg=#ffffff,bold'

# Popup & menus
set -g popup-border-style 'fg=#1a6be0'
set -g popup-style 'bg=#fafafa,fg=#2e3440'
set -g menu-style 'bg=#dde1e8,fg=#2e3440'
set -g menu-selected-style 'bg=#1a6be0,fg=#ffffff,bold'
set -g menu-border-style 'fg=#b0b8c4'

# Clock
setw -g clock-mode-colour '#1a6be0'

# Inactive pane dimming
set -g window-style 'bg=#eef0f4'
set -g window-active-style 'bg=#fafafa'

# pmux theme: ServiceNow Dark
# Official ServiceNow brand colors — wasabi green + infinite blue

# Status bar
set -g status-style 'bg=#032d42 fg=#e8ecf1'
set -g status-left '#[bg=#63df4e,fg=#032d42,bold]  #S #[bg=#032d42,fg=#63df4e] '
set -g status-right '#[fg=#035d99,bg=#032d42]#{?#{==:#(~/.tmux/scripts/pmux-claude-usage.sh),},,#[bg=#035d99#,fg=#63df4e]  #(~/.tmux/scripts/pmux-claude-usage.sh) #[fg=#032d42]│}#[bg=#035d99,fg=#c2e6ff]  %Y-%m-%d #[fg=#63df4e,bg=#035d99]#[bg=#63df4e,fg=#032d42,bold]  %-l:%M#{?#{==:%p,AM},am,pm} '

# Window status
setw -g window-status-format '#[fg=#52b8ff,bg=#032d42]  #I:#W '
setw -g window-status-current-format '#[fg=#032d42,bg=#63df4e]#[fg=#032d42,bg=#63df4e,bold]  #I:#W #[fg=#63df4e,bg=#032d42]'
setw -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#035d99'
set -g pane-active-border-style 'fg=#63df4e'

# Pane border labels
setw -g pane-border-format '#{?pane_active,#[bg=#63df4e#,fg=#032d42#,bold] #{pane_index}: #{pane_current_command} ,#[bg=#035d99#,fg=#c2e6ff] #{pane_index}: #{pane_current_command} }'

# Message & command prompt
set -g message-style 'bg=#63df4e fg=#032d42 bold'
set -g message-command-style 'bg=#035d99 fg=#e8ecf1'

# Copy / choice mode
setw -g mode-style 'bg=#63df4e fg=#032d42 bold'
set -g copy-mode-match-style 'bg=#035d99,fg=#e8ecf1'
set -g copy-mode-current-match-style 'bg=#63df4e,fg=#032d42,bold'

# Popup & menus
set -g popup-border-style 'fg=#63df4e'
set -g popup-style 'bg=#020c15,fg=#e8ecf1'
set -g menu-style 'bg=#032d42,fg=#e8ecf1'
set -g menu-selected-style 'bg=#63df4e,fg=#032d42,bold'
set -g menu-border-style 'fg=#035d99'

# Clock
setw -g clock-mode-colour '#63df4e'

# Inactive pane dimming
set -g window-style 'bg=#010810'
set -g window-active-style 'bg=#020c15'
